<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MediManage – Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/inven.css">
</head>
<body>
  <div class="sidebar">
    <div class="logo"> MediManage</div>
    <a href="dashboard.html"><i class="bx bx-grid-alt"></i> Dashboard</a>
    <a href="billing.html"><i class="bx bx-receipt"></i> Billing</a>
    <a class="active" href="inventory.html"><i class="bx bx-box"></i> Inventory</a>
    <a href="alert.html"><i class="bx bx-bell"></i> Alerts</a>
    <a href="darft.html"><i class="bx bx-refresh"></i> Auto-Order</a>
    <a href="sam.html"><i class="bx bx-store"></i> Distributor Stock</a>
    <a href="#"><i class="bx bx-cog"></i> Settings</a>
    <!-- ChatGPT Style Profile -->
    <div class="sidebar-profile">
        <div class="profile-left">
            <div class="profile-avatar">DP</div>
            <div class="profile-text">
                <strong>Dhruv</strong>
                <span>Free</span>
            </div>
        </div>
        <button class="profile-btn">Profile</button>
    </div>
  </div>

    <div class="main">
        <div class="header">
            <h3>Inventory Management</h3>
            <div class="right">
                <input placeholder="Search...">
            </div>
        </div>
    </div>

    <!-- ADD PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-box">
            <h2>Add New Medicine</h2>
            <div class="form-grid">
                <input id="p_name" placeholder="Medicine Name">
                <input id="p_hsn" placeholder="HSN Code">
                <input id="p_company" placeholder="Company">

                <input id="p_gst" type="number" placeholder="GST %">
                <input id="p_unit" placeholder="Unit">
                <input id="p_pack" placeholder="Pack (1x10)">

                <input id="p_stock" type="number" placeholder="Stock">
                <input id="p_exp" type="date">

                <input id="p_supplier" placeholder="Supplier">
                <input id="p_category" placeholder="Category">
            </div>
            <div class="modal-actions">
                <button onclick="saveProduct()" class="btn-primary">Save</button>
                <button onclick="closeModal()" class="btn-outline">Cancel</button>
            </div>
            
        </div>
    </div>

    <div class="content">
        <div class="title">
            <h1>Inventory Management</h1>
        </div>

        <div class="controls">
            <input id="searchInput" placeholder="Search products...">
            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Antibiotics">Antibiotics</option>
                <option value="Cold & Flu">Cold & Flu</option>
                <option value="Diabetic Care">Diabetic Care</option>
                <option value="Pain Relief">Pain Relief</option>
                <option value="Supplements">Supplements</option>
            </select>
            <select id="sortSelect">
                <option value="az">Product Name (A-Z)</option>
                 <option value="za">Product Name (Z-A)</option>
            </select>
            <button class="btn-primary" id="addProductBtn"><i class="bx bx-plus"></i> Add New Product</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>unit</th>
                        <th>Expiry Date</th>
                        <th>Supplier</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <div class="pagination">
            <span id="info"></span>
            <span>Page 1 of 1</span>
        </div>
    </div>
  <script src="js/inven.js"></script>
</body>
</html>
